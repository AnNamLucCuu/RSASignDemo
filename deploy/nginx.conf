# Include inside your HTTPS server block; set root to the uploaded dist directory.
# TLS certificate configuration is specific to your host.
root /var/www/rsa-studio/dist;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
location / {
    try_files $uri $uri/ =404;
}
location /assets/ {
    expires 1y;
    try_files $uri =404;
}
# Hash navigation needs no SPA rewrite. For a subdirectory deployment,
# serve dist at that subdirectory and adjust the location blocks accordingly.
